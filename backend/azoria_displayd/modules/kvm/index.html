<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Azoria 显示器控制中心</title>
  <style>
    :root { color-scheme:dark; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif; background:#070910; color:#f8fafc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 15% 0,rgba(99,102,241,.22),transparent 32%),#070910; }
    main { width:min(1120px,100%); margin:auto; padding:32px 22px 60px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:28px; }
    h1 { margin:0; font-size:clamp(27px,4vw,42px); letter-spacing:-.04em; }
    .sub { margin:8px 0 0; color:#94a3b8; }
    .badge { display:flex; align-items:center; gap:8px; padding:10px 14px; border:1px solid #263043; border-radius:999px; background:#111827; color:#cbd5e1; white-space:nowrap; }
    .dot { width:9px; height:9px; border-radius:50%; background:#64748b; }
    .dot.online { background:#22c55e; box-shadow:0 0 16px #22c55e; }
    .grid { display:grid; grid-template-columns:1.45fr .8fr; gap:18px; }
    .card { padding:24px; border:1px solid rgba(255,255,255,.09); border-radius:22px; background:rgba(17,24,39,.86); box-shadow:0 18px 60px rgba(0,0,0,.25); }
    .card h2 { margin:0 0 20px; font-size:18px; }
    .row { display:grid; grid-template-columns:110px 1fr 48px; align-items:center; gap:14px; margin:22px 0; }
    .row output { color:#a5b4fc; text-align:right; font-variant-numeric:tabular-nums; }
    input[type=range] { width:100%; accent-color:#818cf8; }
    .buttons { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    button,a.action { min-height:46px; border:1px solid #30394c; border-radius:13px; background:#1b2332; color:#f8fafc; font:inherit; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; text-decoration:none; }
    button:hover,a.action:hover { filter:brightness(1.15); }
    button.active { color:#090b10; background:#e1f4ff; border-color:#e1f4ff; }
    button.danger { color:#fca5a5; }
    .toggles { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px; }
    .device { display:flex; align-items:flex-start; gap:12px; padding:15px; border-radius:15px; background:#0b101b; }
    .device strong { display:block; margin-bottom:5px; }
    .device small,.hint { color:#94a3b8; line-height:1.55; }
    .stack { display:grid; gap:11px; margin-top:16px; }
    #message { min-height:22px; margin:18px 0 0; color:#a5b4fc; }
    #message.error { color:#fda4af; }
    @media(max-width:780px) { .grid{grid-template-columns:1fr} header{align-items:flex-start;flex-direction:column}.buttons{grid-template-columns:1fr 1fr}.row{grid-template-columns:82px 1fr 42px}.card{padding:20px} }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>显示器控制中心</h1><p class="sub">网页是主程序，小屏幕是可选的实体触控终端。</p></div>
    <div class="badge"><span id="host-dot" class="dot"></span><span id="host-state">正在连接显示器…</span></div>
  </header>
  <div class="grid">
    <section class="card">
      <h2>显示器控制</h2>
      <label class="row"><span>亮度</span><input id="brightness" type="range" min="0" max="100"><output>--</output></label>
      <label class="row"><span>音量</span><input id="volume" type="range" min="0" max="100"><output>--</output></label>
      <h2>输入源</h2>
      <div class="buttons" id="inputs">
        <button data-value="dp1">DisplayPort</button><button data-value="hdmi1">HDMI 1</button><button data-value="hdmi2">HDMI 2</button><button data-value="usbc">USB-C</button>
      </div>
      <div class="toggles"><button id="mute">静音</button></div>
      <p id="message"></p>
    </section>
    <aside class="card">
      <h2>实体小屏幕</h2>
      <div class="device"><span id="usb-dot" class="dot"></span><div><strong id="usb-title">正在检测 USB…</strong><small id="usb-detail">请插入小屏幕的数据线</small></div></div>
      <div class="stack">
        <button id="detect">重新检测 USB</button>
        <button id="flash" disabled>刷写小屏幕固件</button>
        <a class="action" href="/setup">配置小屏幕 Wi‑Fi</a>
      </div>
      <p class="hint">首次使用通过 USB 完成刷写和安全配对。之后程序自动优先使用同一局域网的 Wi‑Fi；Wi‑Fi 不可达时自动回退到蓝牙，不要求用户手动选择。</p>
    </aside>
  </div>
</main>
<script>
  const token = __AZORIA_TOKEN_JSON__;
  const headers = {"Authorization": `Bearer ${token}`, "Content-Type":"application/json"};
  const controls = ["brightness","volume"];
  const message = document.querySelector("#message");
  let state = {};
  function show(text, error=false){ message.textContent=text; message.className=error?"error":""; }
  async function api(path, options={}) { const response=await fetch(path,{cache:"no-store",...options,headers:{...headers,...options.headers}}); const data=await response.json(); if(!response.ok) throw new Error(data.error||`请求失败 (${response.status})`); return data; }
  function render(data){ state=data; document.querySelector("#host-dot").classList.add("online"); document.querySelector("#host-state").textContent="显示器已连接"; for(const name of controls){ const input=document.querySelector(`#${name}`); if(Number.isFinite(data[name])){ input.value=data[name]; input.nextElementSibling.value=data[name]; } } document.querySelector("#mute").classList.toggle("active",!!data.mute); document.querySelector("#mute").textContent=data.mute?"取消静音":"静音"; document.querySelectorAll("#inputs button").forEach(button=>button.classList.toggle("active",button.dataset.value===data.input)); }
  async function refresh(){ try{ render(await api("/v1/status")); }catch(error){ document.querySelector("#host-dot").classList.remove("online"); document.querySelector("#host-state").textContent="显示器未连接"; show(error.message,true); } }
  async function setControl(control,value,final=true){ show("正在写入显示器…"); try{ const result=await api("/v1/control",{method:"POST",body:JSON.stringify({control,value,final})}); if(result.accepted===false) throw new Error("操作未被显示器接受"); show(result.confirmed===false?"命令已发送":"已保存到显示器"); await refresh(); }catch(error){ show(error.message,true); await refresh(); } }
  for(const name of controls){ const input=document.querySelector(`#${name}`); input.addEventListener("input",()=>input.nextElementSibling.value=input.value); input.addEventListener("change",()=>setControl(name,Number(input.value))); }
  document.querySelector("#inputs").addEventListener("click",event=>{ const value=event.target.dataset.value; if(value) setControl("input",value); });
  document.querySelector("#mute").addEventListener("click",()=>setControl("mute",!state.mute));
  let usbDevice="";
  async function detect(){ const title=document.querySelector("#usb-title"),detail=document.querySelector("#usb-detail"),dot=document.querySelector("#usb-dot"),flash=document.querySelector("#flash"); title.textContent="正在检测 USB…"; try{ const data=await api("/v1/setup/device"); usbDevice=data.connected?data.configured:""; dot.classList.toggle("online",data.connected); title.textContent=data.connected?"小屏幕已通过 USB 连接":"未检测到小屏幕"; detail.textContent=data.connected?data.configured:(data.devices.length?`发现 ${data.devices.join("、")}，但尚未选中`:"请插入带数据功能的 USB 线"); flash.disabled=!(data.connected&&data.firmware_available&&!data.flashing); flash.textContent=data.flashing?"正在刷写…":data.firmware_available?"刷写小屏幕固件":"本地固件包不可用"; }catch(error){ title.textContent="USB 检测失败"; detail.textContent=error.message; flash.disabled=true; } }
  document.querySelector("#detect").addEventListener("click",detect);
  document.querySelector("#flash").addEventListener("click",async()=>{ if(!usbDevice||!confirm("确定刷写这个 USB 小屏幕吗？刷写过程中请勿拔线。"))return; const button=document.querySelector("#flash"); button.disabled=true; button.textContent="正在刷写，请勿拔线…"; try{ const result=await api("/v1/setup/flash",{method:"POST",body:JSON.stringify({device:usbDevice})}); show(result.message); }catch(error){ show(error.message,true); } finally{ await detect(); } });
  refresh(); detect(); setInterval(refresh,30000);
</script>
</body>
</html>
