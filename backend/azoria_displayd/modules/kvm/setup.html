<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Azoria 显示器控制器配网</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background: #080b12;
      color: #f7f8fb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 10%, rgba(99,102,241,.25), transparent 38%),
        radial-gradient(circle at 90% 90%, rgba(34,197,94,.13), transparent 34%),
        #080b12;
    }
    main {
      width: min(100%, 520px);
      padding: 34px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 26px;
      background: rgba(17,24,39,.88);
      box-shadow: 0 24px 80px rgba(0,0,0,.45);
      backdrop-filter: blur(20px);
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #a5b4fc;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: 30px; line-height: 1.15; }
    .intro { margin: 14px 0 28px; color: #aeb6c7; line-height: 1.6; }
    label { display: block; margin: 18px 0 8px; font-size: 14px; font-weight: 650; }
    .field { position: relative; display: flex; gap: 10px; }
    select, input, button {
      min-height: 50px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 13px;
      font: inherit;
    }
    select, input {
      width: 100%;
      padding: 0 14px;
      color: #f7f8fb;
      background: #0c1220;
      outline: none;
    }
    select:focus, input:focus { border-color: #818cf8; box-shadow: 0 0 0 3px rgba(99,102,241,.2); }
    button {
      padding: 0 18px;
      color: white;
      background: #242c3d;
      cursor: pointer;
      font-weight: 700;
    }
    button:hover { filter: brightness(1.12); }
    button:disabled { cursor: wait; opacity: .55; }
    #refresh { flex: 0 0 auto; }
    #submit {
      width: 100%;
      margin-top: 24px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: 0;
    }
    .note {
      display: flex;
      gap: 10px;
      margin-top: 22px;
      padding: 13px 14px;
      border-radius: 13px;
      background: rgba(255,255,255,.045);
      color: #9ba5b8;
      font-size: 13px;
      line-height: 1.5;
    }
    #status { min-height: 22px; margin: 18px 0 0; color: #a5b4fc; font-size: 14px; }
    #status.error { color: #fda4af; }
    #status.success { color: #86efac; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Azoria · USB Setup</p>
    <h1>连接家庭 Wi‑Fi</h1>
    <p class="intro">网络列表由 ESP32 通过 USB 扫描，因此这里只会显示开发板实际能够连接的 2.4 GHz 网络。Mac 不会切换 Wi‑Fi。</p>

    <form id="form">
      <label for="ssid">选择 Wi‑Fi</label>
      <div class="field">
        <select id="ssid" required disabled>
          <option>正在扫描附近网络…</option>
        </select>
        <button id="refresh" type="button">重新扫描</button>
      </div>

      <label for="password">Wi‑Fi 密码</label>
      <input id="password" type="password" autocomplete="current-password" maxlength="63" placeholder="输入家庭 Wi‑Fi 密码">

      <button id="submit" type="submit">保存并连接</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <div class="note"><span>🔒</span><span>页面仅允许从这台 Mac 的 localhost 打开。密码不会写入源码或日志，只通过 USB 保存到 ESP32 的 NVS。</span></div>
  </main>
  <script>
    const select = document.querySelector("#ssid");
    const password = document.querySelector("#password");
    const refresh = document.querySelector("#refresh");
    const submit = document.querySelector("#submit");
    const status = document.querySelector("#status");

    function message(text, kind = "") {
      status.textContent = text;
      status.className = kind;
    }

    async function scan() {
      refresh.disabled = true;
      select.disabled = true;
      select.replaceChildren(new Option("正在扫描附近网络…", ""));
      message("ESP32 正在扫描 2.4 GHz Wi‑Fi，请稍候…");
      try {
        const response = await fetch("/v1/setup/networks", {cache: "no-store"});
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "扫描失败");
        select.replaceChildren();
        for (const network of data.networks) {
          const lock = network.secure ? "🔒 " : "";
          const signal = network.rssi >= -55 ? "强" : network.rssi >= -70 ? "中" : "弱";
          select.add(new Option(`${lock}${network.ssid} · 信号${signal}`, network.ssid));
        }
        if (!data.networks.length) select.add(new Option("没有找到可用网络", ""));
        select.disabled = !data.networks.length;
        message(data.networks.length ? `发现 ${data.networks.length} 个网络` : "没有找到 2.4 GHz 网络");
      } catch (error) {
        select.replaceChildren(new Option("扫描失败，请重试", ""));
        message(error.message, "error");
      } finally {
        refresh.disabled = false;
      }
    }

    refresh.addEventListener("click", scan);
    document.querySelector("#form").addEventListener("submit", async event => {
      event.preventDefault();
      if (!select.value) return;
      submit.disabled = true;
      refresh.disabled = true;
      message("正在让 ESP32 验证 Wi‑Fi 和密码，最多需要 20 秒…");
      try {
        const response = await fetch("/v1/setup/apply", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ssid: select.value, password: password.value})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "写入失败");
        password.value = "";
        message("密码验证成功，配置已保存。开发板正在自动寻找 Mac 后台。", "success");
      } catch (error) {
        message(error.message, "error");
        submit.disabled = false;
        refresh.disabled = false;
      }
    });

    scan();
  </script>
</body>
</html>
